server:
  port: 8080

spring:
  application:
    name: USERSERVICE
  datasource:
    url: jdbc:mysql://localhost:3306/microservices_user
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import: "configserver:http://localhost:8085,vault://"

  cloud:
    vault:
      uri: http://127.0.0.1:8200
      authentication: TOKEN
      token: ${VAULT_TOKEN}

      kv:
        enabled: true
        backend: secret
        default-context: userservice

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://integrator-4846454.okta.com/oauth2/default
      client:
        registration:
          user_service_internal_client:
            provider: okta
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          okta:
            issuer-uri: https://integrator-4846454.okta.com/oauth2/default


management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      ratingHotelBreaker:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 6s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED

  retry:
    instances:
      ratingHotelRetryFallback:
        max-attempts: 3
        wait-duration: 2s


