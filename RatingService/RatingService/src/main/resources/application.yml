server:
  port: 8082

spring:
  application:
    name: RATINGSERVICE
  datasource:
    url: jdbc:mysql://localhost:3306/microservices_rating
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://integrator-4846454.okta.com/oauth2/default
      client:
        registration:
          user_service_internal_client:
            provider: okta
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          okta:
            issuer-uri: https://integrator-4846454.okta.com/oauth2/default


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import: "configserver:http://localhost:8085,vault://"

  cloud:
    vault:
      uri: http://127.0.0.1:8200
      authentication: TOKEN
      token: ${VAULT_TOKEN}

      kv:
        enabled: true
        backend: secret
        default-context: ratingservice

resilience4j:
  ratelimiter:
    instances:
      ratingRateLimiter:
        limit-refresh-period: 4s
        limit-for-period: 50
        timeout-duration: 0s

